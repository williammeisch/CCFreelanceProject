    <div class="gallery-lightbox" id="gallery-lightbox" hidden>
      <div class="gallery-lightbox-dialog" role="dialog" aria-modal="true" aria-labelledby="gallery-lightbox-title">
        <button class="gallery-lightbox-close" id="gallery-lightbox-close" type="button" aria-label="Close gallery image viewer">✕</button>
        <h2 id="gallery-lightbox-title" class="visually-hidden">Gallery image viewer</h2>
        <div class="gallery-lightbox-stage">
          <button class="gallery-lightbox-nav" id="gallery-lightbox-prev" type="button" aria-label="Previous gallery image">←</button>
          <img id="gallery-lightbox-image" src="" alt="" />
          <button class="gallery-lightbox-nav" id="gallery-lightbox-next" type="button" aria-label="Next gallery image">→</button>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const images = Array.from(document.querySelectorAll('.gallery-image'));
        const overlay = document.getElementById('gallery-lightbox');
        const dialog = overlay?.querySelector('.gallery-lightbox-dialog');
        const closeBtn = document.getElementById('gallery-lightbox-close');
        const prevBtn = document.getElementById('gallery-lightbox-prev');
        const nextBtn = document.getElementById('gallery-lightbox-next');
        const lightboxImage = document.getElementById('gallery-lightbox-image');
        if (!images.length || !overlay || !dialog || !closeBtn || !prevBtn || !nextBtn || !lightboxImage) return;

        let currentIndex = 0;
        let previousFocus = null;

        const render = () => {
          const selected = images[currentIndex];
          if (!selected) return;
          lightboxImage.src = selected.src;
          lightboxImage.alt = selected.alt || 'Gallery image';
        };

        const open = (index) => {
          currentIndex = index;
          previousFocus = document.activeElement;
          render();
          overlay.hidden = false;
          document.body.style.overflow = 'hidden';
          closeBtn.focus();
        };

        const close = () => {
          overlay.hidden = true;
          document.body.style.overflow = '';
          if (previousFocus instanceof HTMLElement) previousFocus.focus();
        };

        const next = () => {
          currentIndex = (currentIndex + 1) % images.length;
          render();
        };

        const prev = () => {
          currentIndex = (currentIndex - 1 + images.length) % images.length;
          render();
        };

        images.forEach((image, index) => {
          image.addEventListener('click', () => open(index));
          image.setAttribute('tabindex', '0');
          image.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              open(index);
            }
          });
        });

        closeBtn.addEventListener('click', close);
        nextBtn.addEventListener('click', next);
        prevBtn.addEventListener('click', prev);

        overlay.addEventListener('click', (event) => {
          if (event.target === overlay) close();
        });

        document.addEventListener('keydown', (event) => {
          if (overlay.hidden) return;
          if (event.key === 'Escape') close();
          if (event.key === 'ArrowRight') next();
          if (event.key === 'ArrowLeft') prev();
        });
      })();
    </script>
